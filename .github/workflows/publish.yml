name: Publish

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: OIDC replaces a stored token and adds provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Node 24 bundles npm 11.15.0+, which staged trusted publishing requires.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # A release build installs from the lockfile only, never a cache
          # another workflow could have written.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      # prepublishOnly runs typecheck, lint, test and build before uploading.
      # --provenance makes a missing attestation fail the release instead of
      # npm silently skipping it.
      # Staged: the version stays private until a maintainer approves it with
      # 2FA on npmjs.com (Staged Packages) or `npm stage approve <id>`, so a
      # pushed tag alone can't release.
      - run: npm stage publish --provenance
